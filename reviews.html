    <div class="container mt-5 pt-5 mb-5 ps-3 pe-3">

        <div class="text-center mt-4 mb-5">
            <h1 class="page-title text-gold mb-3">Customer Stories</h1>
            <p class="text-white-50 mb-3">See what our improved clients have to say about us.</p>
            <button class="btn-add-review" data-bs-toggle="modal" data-bs-target="#reviewModal">
                <i class="fas fa-plus-circle me-1"></i> Leave a Review
            </button>
        </div>

        <div class="row g-4" id="reviews-container">
            <!-- Loading State -->
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-gold" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3 text-white-50">Loading reviews...</p>
            </div>
        </div>
    </div>

    <script>
        async function loadReviews() {
            try {
                const res = await fetch('/api/reviews');
                const reviews = await res.json();
                const container = document.getElementById('reviews-container');

                if (reviews.length === 0) {
                    container.innerHTML = `
                         <div class="col-12 text-center py-5">
                            <i class="bi bi-chat-quote text-gold fs-1 mb-3"></i>
                            <h3 class="text-white">No reviews yet</h3>
                            <p class="text-white-50">Be the first to share your experience!</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = reviews.map(r => {
                    const imageHTML = r.image ? `<img src="${r.image}" class="review-img-thumb" alt="Review photo" style="width: 100%; height: 200px; object-fit: cover; border-radius: 12px; margin-bottom: 15px;">` : '';
                    return `
                    <div class="col-md-6 col-lg-4">
                        <div class="glass-panel h-100 p-4 hover-lift d-flex flex-column">
                            ${imageHTML}
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <div>
                                    <h5 class="text-gold fw-bold mb-1">${r.name}</h5>
                                    <span class="badge bg-light text-dark bg-opacity-10 text-white border border-light border-opacity-25">${r.serviceType}</span>
                                </div>
                                <div class="text-gold">
                                    ${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}
                                </div>
                            </div>
                            <p class="text-white-50 fst-italic mb-3">"${r.comment}"</p>
                             <div class="border-top border-white border-opacity-10 pt-3 mt-auto">
                                <small class="text-white-50">
                                    <i class="bi bi-calendar3 me-1"></i>
                                    ${new Date(r.createdAt).toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                })}
                                </small>
                            </div>
                        </div>
                    </div>
                `}).join('');
            } catch (err) {
                console.error('Error loading reviews:', err);
                document.getElementById('reviews-container').innerHTML = `
                    <div class="col-12 text-center">
                        <p class="text-danger">Failed to load reviews. Please try again later.</p>
                    </div>
                `;
            }
        }

        window.addEventListener('load', loadReviews);

        // --- ADD REVIEW LOGIC ---
        document.addEventListener('DOMContentLoaded', () => {
            const reviewForm = document.getElementById('reviewForm');
            const stars = document.querySelectorAll('.star-input .fa-star');
            let currentRating = 0;

            // Star Rating Hover & Click Handlers
            stars.forEach(star => {
                star.addEventListener('mouseover', function () {
                    resetStars();
                    const rating = parseInt(this.dataset.value);
                    highlightStars(rating);
                });
                star.addEventListener('mouseout', resetStars);
                star.addEventListener('click', function () {
                    currentRating = parseInt(this.dataset.value);
                    document.getElementById('ratingValue').value = currentRating;
                    highlightStars(currentRating);
                    stars.forEach(s => s.removeEventListener('mouseout', resetStars));
                });
            });

            function highlightStars(rating) {
                for (let i = 0; i < rating; i++) {
                    stars[i].classList.add('filled');
                }
            }

            function resetStars() {
                stars.forEach(star => star.classList.remove('filled'));
                if (currentRating > 0) {
                    highlightStars(currentRating);
                }
            }

            function resizeAndConvertToBase64(file, maxWidth, quality) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = (event) => {
                        const img = new Image();
                        img.src = event.target.result;
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;

                            if (width > maxWidth) {
                                height *= maxWidth / width;
                                width = maxWidth;
                            }
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            resolve(canvas.toDataURL('image/jpeg', quality));
                        };
                        img.onerror = error => reject(error);
                    };
                    reader.onerror = error => reject(error);
                });
            }

            // Form Submit handler
            if (reviewForm) {
                reviewForm.addEventListener('submit', async function (e) {
                    e.preventDefault();

                    if (document.getElementById('ratingValue').value == '0') {
                        alert('Please provide a star rating.');
                        return;
                    }

                    if (!window.__authUser) {
                        alert('Please sign in to leave a review.');
                        if (window.showAuthModal) window.showAuthModal();
                        return;
                    }

                    const submitBtn = reviewForm.querySelector('button[type="submit"]');
                    const originalBtnText = submitBtn.innerHTML;
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Submitting...';

                    const comment = document.getElementById('reviewComment').value;
                    const serviceType = document.getElementById('reviewServiceType').value;
                    const imageFile = document.getElementById('reviewImage').files[0];
                    let imageBase64 = null;

                    if (imageFile) {
                        try {
                            imageBase64 = await resizeAndConvertToBase64(imageFile, 800, 0.7);
                        } catch (err) {
                            console.error('Image resize error:', err);
                        }
                    }

                    const newReview = {
                        email: window.__authUser.email,
                        name: window.__authUser.name || window.__authUser.email.split('@')[0],
                        comment: comment,
                        image: imageBase64,
                        rating: currentRating,
                        serviceType: serviceType
                    };

                    try {
                        const res = await fetch('/api/reviews', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(newReview)
                        });
                        const data = await res.json();

                        if (data.success) {
                            alert('✅ Review submitted successfully!');
                            // Close modal
                            const modalEl = document.getElementById('reviewModal');
                            const modal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
                            modal.hide();
                            
                            // Reset form
                            reviewForm.reset();
                            currentRating = 0;
                            resetStars();
                            stars.forEach(s => s.addEventListener('mouseout', resetStars));

                            // Refresh reviews list
                            loadReviews();
                        } else {
                            alert('❌ Failed to save review: ' + (data.error || 'Unknown error'));
                        }
                    } catch (err) {
                        console.error('Failed to post review:', err);
                        alert('❌ Error saving review. Please try again.');
                    } finally {
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = originalBtnText;
                    }
                });
            }
        });
    </script>

    <!-- Review Modal -->
    <div class="modal fade" id="reviewModal" tabindex="-1">

            <div class="modal-content premium-modal">

                                <i class="fas fa-star" data-value="3"></i>
                                <i class="fas fa-star" data-value="4"></i>
                                <i class="fas fa-star" data-value="5"></i>
                            </div>
                            <input type="hidden" id="ratingValue" value="0">
                        </div>
                        <div class="mb-4">
                            <label class="text-gold fw-bold mb-2">Your Experience</label>
                            <textarea class="form-control" id="reviewComment" rows="4" placeholder="How was our service? Your feedback matters to us..." required></textarea>
                        </div>
                        <div class="mb-4">
                            <label class="text-gold fw-bold mb-2">Service Type</label>
                            <select class="form-control" id="reviewServiceType">
                                <option value="General">General Service</option>
                                <option value="Catering">Catering</option>
                                <option value="Travels">Travels</option>
                                <option value="Photography">Photography</option>
                                <option value="Sweets">Sweets</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="text-gold fw-bold mb-2">Add Photo (Optional)</label>
                            <input type="file" class="form-control" id="reviewImage" accept="image/*">
                        </div>
                        <button type="submit" class="btn btn-warning w-100 fw-bold py-3 mt-2 shadow-sm rounded-pill">
                            <i class="fas fa-paper-plane me-2"></i>Submit Review
                        </button>
                    </form>
                </div>
            </div>
        </div>
